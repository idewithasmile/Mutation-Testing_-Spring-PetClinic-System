<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title & Metadata Header -->
  <text x="480" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ĐỒ THỊ LUỒNG: OwnerController.processFindForm</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">V(G) = E - N + 2 = 19 - 14 + 2 = 7 | V(G) = P + 1 = 6 + 1 = 7 | 7 Basis Paths</text>

  <!-- N1 (Decision) -->
  <g filter="url(#shadow2)">
    <rect x="330" y="80" width="300" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="480" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">N1 (Dòng 95-97): Entry</text>
    <text x="480" y="122" text-anchor="middle" font-size="12" fill="#1e40af">owner.getLastName() == null?</text>
  </g>

  <!-- N2 (Action) -->
  <g filter="url(#shadow2)">
    <rect x="180" y="170" width="220" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="290" y="199" text-anchor="middle" font-size="12" fill="#14532d">N2 (98): owner.setLastName("")</text>
  </g>

  <!-- N3 (Action) -->
  <g filter="url(#shadow2)">
    <rect x="560" y="170" width="220" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="670" y="199" text-anchor="middle" font-size="12" fill="#14532d">N3 (100): lastName = getLastName()</text>
  </g>

  <!-- N4 (Decision: page < 1) -->
  <g filter="url(#shadow2)">
    <rect x="310" y="255" width="340" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="480" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">N4 (Dòng 104-108): Tra cứu phân trang</text>
    <text x="480" y="298" text-anchor="middle" font-size="12" fill="#1e40af">findPaginated(...) | page &lt; 1?</text>
  </g>

  <!-- N5 (Decision: page > totalPages) -->
  <g filter="url(#shadow2)">
    <rect x="540" y="350" width="320" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="700" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">N5 (Dòng 108): Kiểm tra vượt trần</text>
    <text x="700" y="392" text-anchor="middle" font-size="12" fill="#1e40af">page &gt; Math.max(totalPages, 1)?</text>
  </g>

  <!-- N6 (Decision: !lastName.isEmpty()) -->
  <g filter="url(#shadow2)">
    <rect x="100" y="445" width="310" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <text x="255" y="469" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">N6 (Dòng 109-110): Xử lý vượt biên</text>
    <text x="255" y="489" text-anchor="middle" font-size="12" fill="#b45309">addParam("page", 1) | !lastName.isEmpty()?</text>
  </g>

  <!-- N7 (Action) -->
  <g filter="url(#shadow2)">
    <rect x="50" y="550" width="200" height="45" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="150" y="577" text-anchor="middle" font-size="11" fill="#14532d">N7 (111): addParam("lastName")</text>
  </g>

  <!-- N8 (Redirect Out of bounds) -->
  <g filter="url(#shadow2)">
    <rect x="180" y="635" width="220" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <text x="290" y="665" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">N8 (113): redirect:/owners</text>
  </g>

  <!-- N9 (Decision: isEmpty) -->
  <g filter="url(#shadow2)">
    <rect x="630" y="445" width="280" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="770" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">N9 (Dòng 116): Kiểm tra rỗng</text>
    <text x="770" y="487" text-anchor="middle" font-size="12" fill="#1e40af">ownersResults.isEmpty()?</text>
  </g>

  <!-- N10 (Action: Not found) -->
  <g filter="url(#shadow2)">
    <rect x="500" y="540" width="220" height="55" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <text x="610" y="563" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">N10 (Dòng 118-119): Không tìm thấy</text>
    <text x="610" y="582" text-anchor="middle" font-size="11" fill="#b91c1c">rejectValue | return findOwners</text>
  </g>

  <!-- N11 (Decision: totalElements == 1) -->
  <g filter="url(#shadow2)">
    <rect x="740" y="540" width="200" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="840" y="563" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">N11 (Dòng 122)</text>
    <text x="840" y="582" text-anchor="middle" font-size="11" fill="#1e40af">getTotalElements() == 1?</text>
  </g>

  <!-- N12 (Redirect Single) -->
  <g filter="url(#shadow2)">
    <rect x="680" y="635" width="200" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <text x="780" y="665" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">N12 (124): redirect:/owners/{id}</text>
  </g>

  <!-- N13 (Action Multiple) -->
  <g filter="url(#shadow2)">
    <rect x="720" y="725" width="220" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="830" y="755" text-anchor="middle" font-size="11" fill="#14532d">N13 (129): return ownersList</text>
  </g>

  <!-- N14 (Exit) -->
  <g filter="url(#shadow2)">
    <rect x="370" y="820" width="220" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" />
    <text x="480" y="851" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">N14 (130): Exit (Kết thúc)</text>
  </g>

  <!-- Connectors -->
  <!-- N1 -> N2 (True) -->
  <path d="M 400 135 L 320 170" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N1 -> N3 (False) -->
  <path d="M 560 135 L 640 170" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N2 -> N4 -->
  <path d="M 320 218 L 410 255" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N3 -> N4 -->
  <path d="M 640 218 L 550 255" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N4 -> N6 (True: page < 1) -->
  <path d="M 340 313 L 260 445" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow2)" />
  <!-- N4 -> N5 (False: page >= 1) -->
  <path d="M 580 313 L 640 350" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N5 -> N6 (True: page > max) -->
  <path d="M 570 405 L 370 445" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow2)" />
  <!-- N5 -> N9 (False: in bounds) -->
  <path d="M 730 405 L 750 445" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N6 -> N7 (True: !empty) -->
  <path d="M 190 505 L 160 550" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N6 -> N8 (False: empty) -->
  <path d="M 270 505 L 285 635" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N7 -> N8 -->
  <path d="M 180 595 L 240 635" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N8 -> N14 -->
  <path d="M 290 685 L 290 845 L 370 845" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N9 -> N10 (True: empty) -->
  <path d="M 700 500 L 640 540" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N9 -> N11 (False: not empty) -->
  <path d="M 820 500 L 835 540" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N10 -> N14 -->
  <path d="M 610 595 L 610 845 L 590 845" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N11 -> N12 (True: 1 result) -->
  <path d="M 800 595 L 785 635" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N11 -> N13 (False: >1 results) -->
  <path d="M 890 595 L 900 750 L 940 750" fill="none" stroke="#2563eb" stroke-width="1.5" />
  <path d="M 940 750 L 940 750 L 940 750" fill="none" />
  <path d="M 870 595 L 860 725" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N12 -> N14 -->
  <path d="M 780 685 L 780 845 L 590 845" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)" />
  <!-- N13 -> N14 -->
  <path d="M 830 775 L 830 845 L 590 845" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)" />

</svg>