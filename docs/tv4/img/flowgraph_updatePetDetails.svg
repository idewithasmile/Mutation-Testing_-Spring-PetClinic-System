<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 780" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title & Metadata Header -->
  <text x="425" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ĐỒ THỊ LUỒNG: PetController.updatePetDetails</text>
  <text x="425" y="62" text-anchor="middle" font-size="13" fill="#64748b">V(G) = E - N + 2 = 8 - 7 + 2 = 3 | V(G) = P + 1 = 2 + 1 = 3 | 3 Basis Paths</text>

  <!-- Node N1 (Decision) -->
  <g filter="url(#shadow)">
    <rect x="225" y="90" width="400" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="425" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">N1 (Dòng 186-188): Entry &amp; Khẳng định ID</text>
    <text x="425" y="140" text-anchor="middle" font-size="13" fill="#1e40af">id = pet.getId() | Assert.state(id != null)?</text>
  </g>

  <!-- Node N2 (Error) -->
  <g filter="url(#shadow)">
    <rect x="50" y="225" width="280" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <text x="190" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">N2 (Dòng 188): Ném ngoại lệ</text>
    <text x="190" y="275" text-anchor="middle" font-size="12" fill="#b91c1c">throw IllegalStateException</text>
  </g>

  <!-- Node N3 (Decision) -->
  <g filter="url(#shadow)">
    <rect x="420" y="225" width="380" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="610" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">N3 (Dòng 189-190): Tra cứu Pet trong Owner</text>
    <text x="610" y="275" text-anchor="middle" font-size="13" fill="#1e40af">existingPet = owner.getPet(id) != null?</text>
  </g>

  <!-- Node N4 (Action - Core Update) -->
  <g filter="url(#shadow)">
    <rect x="400" y="360" width="420" height="95" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="610" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">N4 (Dòng 192-194): Cập nhật thực thể quản lý</text>
    <text x="610" y="410" text-anchor="middle" font-size="12" fill="#166534">existingPet.setName(pet.getName())  [Mutant 192]</text>
    <text x="610" y="428" text-anchor="middle" font-size="12" fill="#166534">existingPet.setBirthDate(pet.getBirthDate()) [Mutant 193]</text>
    <text x="610" y="446" text-anchor="middle" font-size="12" fill="#166534">existingPet.setType(pet.getType())   [Mutant 194]</text>
  </g>

  <!-- Node N5 (Action - Add Pet) -->
  <g filter="url(#shadow)">
    <rect x="180" y="375" width="180" height="65" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="270" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">N5 (Dòng 197)</text>
    <text x="270" y="424" text-anchor="middle" font-size="12" fill="#166534">owner.addPet(pet)</text>
  </g>

  <!-- Node N6 (Action - DB Save) -->
  <g filter="url(#shadow)">
    <rect x="360" y="520" width="300" height="65" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="510" y="548" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">N6 (Dòng 199): Lưu cơ sở dữ liệu</text>
    <text x="510" y="569" text-anchor="middle" font-size="12" fill="#166534">this.owners.saveAndFlush(owner)</text>
  </g>

  <!-- Node N7 (Exit) -->
  <g filter="url(#shadow)">
    <rect x="390" y="660" width="240" height="55" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" />
    <text x="510" y="694" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">N7 (Dòng 200): Exit (Kết thúc)</text>
  </g>

  <!-- Edges & Branch Labels -->
  <!-- N1 -> N2 (False) -->
  <path d="M 320 165 L 190 225" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="200" y="180" width="115" height="22" rx="4" fill="#ffffff" stroke="#fecaca" stroke-width="1" />
  <text x="257" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">False (id == null)</text>

  <!-- N1 -> N3 (True) -->
  <path d="M 520 165 L 610 225" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="580" y="180" width="105" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="632" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">True (id != null)</text>

  <!-- N2 -> N7 (Exception Exit) -->
  <path d="M 190 295 L 190 687 L 390 687" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />

  <!-- N3 -> N4 (True: Found) -->
  <path d="M 610 295 L 610 360" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="620" y="318" width="130" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="685" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">True (existing != null)</text>

  <!-- N3 -> N5 (False: Not found) -->
  <path d="M 450 295 L 270 375" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="300" y="325" width="130" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="365" y="341" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">False (existing == null)</text>

  <!-- N4 -> N6 -->
  <path d="M 610 455 L 560 520" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- N5 -> N6 -->
  <path d="M 270 440 L 410 520" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- N6 -> N7 -->
  <path d="M 510 585 L 510 660" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

</svg>